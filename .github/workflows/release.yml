name: Package plugin release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to package (for example v1.1.80)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Choose and stamp release version
        env:
          REQUESTED_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag=$(python3 scripts/prepare-release.py --tag "$REQUESTED_TAG")
          else
            tag=$(python3 scripts/prepare-release.py)
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies and build
        run: |
          npm ci
          npm run build

      - name: Check PHP syntax
        run: |
          php -l rise-landing-pages.php
          find src templates config -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check updater regressions
        run: |
          php tests/updater.php
          python3 tests/release.py

      - name: Validate versions and package runtime
        run: python3 scripts/package.py --version "$RELEASE_TAG"

      - name: Publish the WordPress update ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" != 'true' ]]; then
              echo 'This release is already published. Bump the version and create a new tag.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/rise-landing-pages.zip --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release create "$RELEASE_TAG" dist/rise-landing-pages.zip \
              --target "$RELEASE_COMMIT" --latest --title "Rise Landing Pages $RELEASE_TAG" --generate-notes
          fi
          echo 'The installable ZIP is published. WordPress Check for updates can now find it.' >> "$GITHUB_STEP_SUMMARY"
