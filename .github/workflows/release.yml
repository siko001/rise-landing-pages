name: Package plugin release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag to package (for example v1.1.80)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate stable tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tags must use vX.Y.Z with no prerelease suffix.' >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies and build
        run: |
          npm ci
          npm run build

      - name: Check PHP syntax
        run: |
          php -l rise-landing-pages.php
          find src templates config -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check updater regressions
        run: php tests/updater.php

      - name: Validate versions and package runtime
        run: python3 scripts/package.py --version "$RELEASE_TAG"

      - name: Attach ZIP to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" != 'true' ]]; then
              echo 'This release is already published. Bump the version and create a new tag.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/rise-landing-pages.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/rise-landing-pages.zip \
              --verify-tag --draft --title "Rise Landing Pages $RELEASE_TAG" --generate-notes
          fi
          echo 'The installable ZIP is attached to a draft release. Publish it as the latest stable release when ready.' >> "$GITHUB_STEP_SUMMARY"
